<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFIR Framework — {% block title %}Dashboard{% endblock %}</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  :root {
    --bg-dark:   #0a0e1a;
    --bg-card:   #111827;
    --bg-side:   #0d1117;
    --accent:    #00d4ff;
    --accent2:   #ff4d6d;
    --accent3:   #39ff14;
    --text-mute: #8b9ab0;
    --border:    #1e2a3a;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg-dark);
    color: #e2e8f0;
    font-family: 'Courier New', monospace;
    margin: 0;
  }
  /* SIDEBAR */
  .sidebar {
    width: 240px; height: 100vh; position: fixed; left: 0; top: 0;
    background: var(--bg-side);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    z-index: 100;
  }
  .sidebar-brand {
    padding: 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .brand-title {
    font-size: 0.75rem; font-weight: 700; letter-spacing: 3px;
    color: var(--accent); text-transform: uppercase;
  }
  .brand-sub { font-size: 0.6rem; color: var(--text-mute); letter-spacing: 2px; }
  .live-dot {
    display: inline-block; width: 8px; height: 8px;
    background: var(--accent3); border-radius: 50%;
    animation: pulse 1.5s infinite; margin-right: 6px;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.3)} }
  .nav-link {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 20px; color: var(--text-mute);
    text-decoration: none; font-size: 0.78rem;
    letter-spacing: 1px; transition: all .2s;
    border-left: 3px solid transparent;
  }
  .nav-link:hover, .nav-link.active {
    color: var(--accent); background: rgba(0,212,255,.06);
    border-left-color: var(--accent);
  }
  .nav-link i { font-size: 1rem; width: 18px; }
  /* MAIN */
  .main-content { margin-left: 240px; padding: 28px 32px; min-height: 100vh; }
  /* CARDS */
  .card-dark {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 20px;
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 20px;
    position: relative; overflow: hidden;
  }
  .stat-card::before {
    content:''; position:absolute; top:0; left:0;
    width:3px; height:100%;
    background: var(--c, var(--accent));
  }
  .stat-val { font-size: 2rem; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 0.65rem; color: var(--text-mute); letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
  /* SEVERITY BADGES */
  .sev-critical { background:#3d0014;color:#ff4d6d;border:1px solid #ff4d6d; }
  .sev-high     { background:#2d1a00;color:#ff8c00;border:1px solid #ff8c00; }
  .sev-medium   { background:#1a1a00;color:#ffd700;border:1px solid #ffd700; }
  .sev-low      { background:#001a0d;color:#39ff14;border:1px solid #39ff14; }
  .badge-sev {
    padding: 3px 9px; border-radius: 4px;
    font-size: 0.65rem; font-weight: 700; letter-spacing: 1px;
  }
  /* TABLE */
  .dfir-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  .dfir-table th {
    background: #0d1117; color: var(--text-mute);
    padding: 10px 14px; text-transform: uppercase;
    font-size: 0.6rem; letter-spacing: 2px;
    border-bottom: 1px solid var(--border); text-align: left;
  }
  .dfir-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .dfir-table tr:hover td { background: rgba(0,212,255,.03); }
  /* PAGE HEADER */
  .page-header { margin-bottom: 28px; }
  .page-header h1 { font-size: 1.1rem; letter-spacing: 3px; text-transform: uppercase; margin: 0; }
  .page-header p  { font-size: 0.7rem; color: var(--text-mute); margin: 4px 0 0; letter-spacing: 1px; }
  /* TIMELINE */
  .tl-item { display:flex; gap:16px; margin-bottom:16px; }
  .tl-line { display:flex; flex-direction:column; align-items:center; }
  .tl-dot  { width:12px;height:12px;border-radius:50%;border:2px solid; flex-shrink:0; margin-top:4px; }
  .tl-connector { width:2px;flex:1;background:var(--border);margin:4px 0; }
  .tl-body { flex:1; padding-bottom:4px; }
  .tl-time { font-size:0.65rem;color:var(--text-mute); }
  .tl-desc { font-size:0.8rem;margin:2px 0; }
  /* SCROLLBAR */
  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background:var(--bg-dark); }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  /* SEARCH INPUT */
  .dfir-input {
    background: #0d1117; border: 1px solid var(--border);
    color: #e2e8f0; border-radius: 6px; padding: 8px 12px;
    font-family: 'Courier New', monospace; font-size: 0.78rem;
  }
  .dfir-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,212,255,.1); }
  .dfir-btn {
    background: rgba(0,212,255,.1); border: 1px solid var(--accent);
    color: var(--accent); padding: 8px 16px; border-radius: 6px;
    font-family: 'Courier New',monospace; font-size: 0.78rem;
    cursor: pointer; transition: all .2s; text-decoration: none; display: inline-block;
  }
  .dfir-btn:hover { background: rgba(0,212,255,.2); color: var(--accent); }
  .dfir-btn-red { border-color:var(--accent2);color:var(--accent2);background:rgba(255,77,109,.1); }
  .dfir-btn-red:hover { background:rgba(255,77,109,.2);color:var(--accent2); }
</style>
</head>
<body>
<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-title">⬡ DFIR</div>
    <div class="brand-sub"><span class="live-dot"></span>FRAMEWORK v1.0</div>
  </div>
  <nav style="padding:12px 0">
    <a href="/"            class="nav-link {% if request.path=='/' %}active{% endif %}"><i class="bi bi-speedometer2"></i> DASHBOARD</a>
    <a href="/alerts"      class="nav-link {% if '/alerts' in request.path %}active{% endif %}"><i class="bi bi-bell-fill"></i> ALERTS</a>
    <a href="/correlation" class="nav-link {% if '/correlation' in request.path %}active{% endif %}"><i class="bi bi-diagram-3-fill"></i> CORRELATION</a>
    <a href="/timeline"    class="nav-link {% if '/timeline' in request.path %}active{% endif %}"><i class="bi bi-clock-history"></i> TIMELINE</a>
    <a href="/iocs"        class="nav-link {% if '/iocs' in request.path %}active{% endif %}"><i class="bi bi-shield-exclamation"></i> IOC INTEL</a>
    <div style="margin:16px 20px;border-top:1px solid var(--border)"></div>
    <a href="/report/csv"      class="nav-link"><i class="bi bi-download"></i> EXPORT ALERTS</a>
    <a href="/report/iocs/csv" class="nav-link"><i class="bi bi-download"></i> EXPORT IOCs</a>
  </nav>
  <div style="margin-top:auto;padding:16px;font-size:0.6rem;color:var(--text-mute);border-top:1px solid var(--border)">
    DFIR Correlation Framework<br>Final Year Project — 2025
  </div>
</div>

<!-- MAIN -->
<div class="main-content">
  {% block content %}{% endblock %}
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
